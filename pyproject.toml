[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telbot"
version = "0.4.0"
description = "INDI CLI for Raspberry Pi + Gemini: GOTO, park, JSON/HTTP, Skyfield bodies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2",
  "pydantic-settings>=2",
  "skyfield>=1.51",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=4", "httpx>=0.27", "openai>=1.40", "astropy>=6", "astroquery>=0.4.7", "astroplan>=0.10"]
platesolve = ["astropy>=6"]
livestack = ["astropy>=6", "pillow>=10"]
autofocus = ["astropy>=6"]
exoplanets = ["astropy>=6", "astroquery>=0.4.7", "astroplan>=0.10"]
semantic = ["sentence-transformers>=3.0"]
voice = ["openai>=1.40", "pynput>=1.7"]
llm = ["openai>=1.40"]

[tool.setuptools.package-data]
telbot = ["data/*.jsonl", "data/*.json"]

[project.scripts]
telbot = "telbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
